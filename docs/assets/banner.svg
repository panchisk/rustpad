<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">RustPad: a Windows soundboard written in Rust</title>
  <desc id="desc">Black cover with the RustPad wordmark, a signal-bar mark and a waveform made of vertical bars.</desc>

  <rect width="1600" height="600" fill="#000000"/>

  <!-- identity -->
  <g transform="translate(96 82)">
    <rect width="72" height="72" rx="20" fill="#EEECE6"/>
    <rect x="20" y="31" width="6" height="12" rx="3" fill="#09090A"/>
    <rect x="33" y="20" width="6" height="34" rx="3" fill="#09090A"/>
    <rect x="46" y="28" width="6" height="18" rx="3" fill="#09090A"/>
  </g>
  <text x="96" y="256" fill="#F4F2ED" font-family="Segoe UI, Arial, sans-serif" font-size="116" font-weight="600" letter-spacing="-4">RustPad</text>
  <text x="100" y="306" fill="#9C9DA3" font-family="Segoe UI, Arial, sans-serif" font-size="24">Windows soundboard</text>
  <text x="100" y="360" fill="#F4F2ED" font-family="Segoe UI, Arial, sans-serif" font-size="24">Reads Soundpad 4.x lists, hotkeys and remote control.</text>
  <text x="100" y="394" fill="#9C9DA3" font-family="Segoe UI, Arial, sans-serif" font-size="24">Routes sound and voice through one virtual cable.</text>

  <line x1="96" y1="456" x2="690" y2="456" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <g font-family="Consolas, monospace" font-size="15" fill="#7E8087">
    <text x="96" y="490">Soundpad .spl</text>
    <text x="300" y="490">VB-CABLE</text>
    <text x="470" y="490">WASAPI</text>
    <text x="620" y="490">Rust</text>
  </g>


<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">RustPad microphone routing through VB-CABLE</title>
  <desc id="desc">The physical microphone and decoded sounds meet in the RustPad mixer and leave through CABLE Input. Voice apps listen on CABLE Output.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0F"/>
      <stop offset="1" stop-color="#07070A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#7C6CFF"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#67677A"/>
    </marker>
  </defs>

  <rect width="1200" height="380" rx="22" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="42" y="50" fill="#F3F3F7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" font-weight="600">Microphone routing</text>
  <text x="42" y="72" fill="#777785" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">One virtual cable is enough. No APO, no kernel driver.</text>

  <!-- microphone -->
  <rect x="42" y="112" width="206" height="64" rx="12" fill="#111116" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="62" y="138" fill="#EDEDF3" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600">Microphone</text>
  <text x="62" y="157" fill="#858593" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5">fifine, headset, interface</text>

  <!-- sounds -->
  <rect x="42" y="224" width="206" height="64" rx="12" fill="#111116" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="62" y="250" fill="#EDEDF3" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600">Sounds</text>
  <text x="62" y="269" fill="#858593" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5">MP3 · WAV · FLAC · OGG · AAC</text>

  <!-- capture / decode -->
  <rect x="316" y="112" width="190" height="64" rx="12" fill="#111116" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="336" y="138" fill="#EDEDF3" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600">WASAPI capture</text>
  <text x="336" y="157" fill="#858593" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5">48 kHz · resampled</text>

  <rect x="316" y="224" width="190" height="64" rx="12" fill="#111116" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="336" y="250" fill="#EDEDF3" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600">Decoder</text>
  <text x="336" y="269" fill="#858593" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5">symphonia · f32 stereo</text>

  <!-- mixer -->
  <rect x="574" y="150" width="164" height="100" rx="14" fill="#7C6CFF" fill-opacity="0.14" stroke="#7C6CFF" stroke-opacity="0.6"/>
  <text x="656" y="186" text-anchor="middle" fill="#F4F2FF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="600">Mixer</text>
  <text x="656" y="206" text-anchor="middle" fill="#B9B2E8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5">voice + sounds</text>
  <text x="656" y="224" text-anchor="middle" fill="#8F88B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5">per-target gain</text>

  <!-- cable -->
  <rect x="804" y="150" width="176" height="100" rx="12" fill="#111116" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="892" y="180" text-anchor="middle" fill="#EDEDF3" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600">CABLE Input</text>
  <text x="892" y="199" text-anchor="middle" fill="#858593" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5">virtual playback</text>
  <rect x="834" y="214" width="116" height="18" rx="9" fill="#7C6CFF" fill-opacity="0.2"/>
  <text x="892" y="227" text-anchor="middle" fill="#BDB4FF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="9">selected in RustPad</text>

  <!-- output -->
  <rect x="1030" y="150" width="128" height="100" rx="12" fill="#111116" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="1094" y="180" text-anchor="middle" fill="#EDEDF3" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600">CABLE Output</text>
  <text x="1094" y="199" text-anchor="middle" fill="#858593" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5">virtual mic</text>
  <text x="1094" y="225" text-anchor="middle" fill="#858593" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5">Discord · OBS</text>

  <!-- links -->
  <path d="M248 144H316" fill="none" stroke="#67677A" stroke-width="1.4" marker-end="url(#arrowMuted)"/>
  <path d="M248 256H316" fill="none" stroke="#67677A" stroke-width="1.4" marker-end="url(#arrowMuted)"/>
  <path d="M506 144H574" fill="none" stroke="#7C6CFF" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M506 256C540 256 540 206 574 206" fill="none" stroke="#7C6CFF" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M738 200H804" fill="none" stroke="#7C6CFF" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M980 200H1030" fill="none" stroke="#7C6CFF" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="42" y="330" fill="#666675" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5">Install VB-CABLE once, then RustPad detects CABLE Input and selects it as the microphone target.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">RustPad crate layout</title>
  <desc id="desc">The egui application sits on top of core, audio and platform crates.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0F"/>
      <stop offset="1" stop-color="#07070A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#67677A"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="48" y="58" fill="#F3F3F7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="600">Workspace</text>
  <text x="48" y="80" fill="#777785" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Four crates, one binary. No runtime plugins.</text>

  <!-- app -->
  <rect x="330" y="112" width="540" height="104" rx="14" fill="#7C6CFF" fill-opacity="0.13" stroke="#7C6CFF" stroke-opacity="0.55"/>
  <text x="356" y="146" fill="#F6F6F8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="600">rustpad-app</text>
  <text x="356" y="170" fill="#B9B9C6" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">egui shell · sound table · hotbar · settings · editor · recorder</text>
  <text x="356" y="190" fill="#8A8A99" font-family="Consolas, Cascadia Mono, monospace" font-size="11">src/main.rs · src/app.rs · src/ui.rs · src/theme.rs</text>

  <!-- core -->
  <rect x="48" y="312" width="336" height="138" rx="14" fill="#111116" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="70" y="344" fill="#F3F3F7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="600">rustpad-core</text>
  <text x="70" y="368" fill="#A5A5B2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">Soundpad .spl reader and writer</text>
  <text x="70" y="386" fill="#A5A5B2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">categories · hashes · stats · config</text>
  <text x="70" y="410" fill="#7A7A8A" font-family="Consolas, Cascadia Mono, monospace" font-size="10.5">model.rs · spl.rs · hotkey.rs</text>

  <!-- audio -->
  <rect x="432" y="312" width="336" height="138" rx="14" fill="#111116" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="454" y="344" fill="#F3F3F7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="600">rustpad-audio</text>
  <text x="454" y="368" fill="#A5A5B2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">cpal / WASAPI streams · decode</text>
  <text x="454" y="386" fill="#A5A5B2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">mixer · microphone bus · loopback</text>
  <text x="454" y="410" fill="#7A7A8A" font-family="Consolas, Cascadia Mono, monospace" font-size="10.5">engine.rs · mixer.rs · decode.rs</text>

  <!-- platform -->
  <rect x="816" y="312" width="336" height="138" rx="14" fill="#111116" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="838" y="344" fill="#F3F3F7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="600">rustpad-platform</text>
  <text x="838" y="368" fill="#A5A5B2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">global hotkeys · remote pipe · TTS</text>
  <text x="838" y="386" fill="#A5A5B2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">autostart · VB-CABLE detection</text>
  <text x="838" y="410" fill="#7A7A8A" font-family="Consolas, Cascadia Mono, monospace" font-size="10.5">hotkeys.rs · pipe.rs · vbcable.rs</text>

  <!-- links -->
  <path d="M216 312V252H330" fill="none" stroke="#67677A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M600 312V252" fill="none" stroke="#67677A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M984 312V252H870" fill="none" stroke="#67677A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M384 382H432" fill="none" stroke="#67677A" stroke-width="1.2"/>
  <path d="M768 382H816" fill="none" stroke="#67677A" stroke-width="1.2"/>

  <text x="48" y="486" fill="#666675" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5">Windows 10 / 11 · MSVC · Rust 1.80+</text>
  <text x="1152" y="486" text-anchor="end" fill="#666675" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5">cargo test --workspace</text>
</svg>
